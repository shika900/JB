<!doctype html>
<html lang="en" manifest="cache.manifest">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050a14">
  <title>Shika PS4 • 11.xx</title>
  <link rel="stylesheet" href="includes/style.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="brand-mark">PS4</div>
      <div>
        <p class="eyebrow">SHIKA • PS4 TOOLKIT</p>
        <h1>CSSFontFace <span>UAF</span></h1>
        <p class="subtitle" id="UA">Running on:</p>
      </div>
    </header>

    <section class="control-card">
      <div class="section-title">
        <span>Kernel chain</span>
        <small>Choose your preferred method</small>
      </div>

      <form id="kernel-options" class="radio-group">
        <label class="radio-item">
          <input type="radio" name="kernel" id="lapse-exploit" value="lapse">
          <span class="radio-ui"></span>
          <span><b>Lapse</b><small>Recommended</small></span>
        </label>
        <label class="radio-item">
          <input type="radio" name="kernel" id="netctrl-exploit" value="netctrl">
          <span class="radio-ui"></span>
          <span><b>NetCtrl</b><small>Alternative</small></span>
        </label>
      </form>

      <button id="jeilbrek" class="jb-button" type="button">
        <span>JAILBREAK</span>
        <i>→</i>
      </button>

      <label class="autoJb">
        <span>
          <b id="autoJbLabel">Auto Jailbreak</b>
          <small>Start automatically after page load</small>
        </span>
        <input id="autoJbInput" type="checkbox">
        <span class="switch"></span>
      </label>
    </section>

    <section class="workspace">
      <div class="media-box">
        <img src="includes/ps4.png" alt="PS4 console">
        <div class="status-pill"><span></span> Ready</div>
      </div>
      <div class="console-wrap">
        <div class="console-head">
          <span>CONSOLE OUTPUT</span>
          <small>LIVE</small>
        </div>
        <pre id="console">Ready. Awaiting execution...</pre>
      </div>
    </section>

    <footer>Firmware 11.xx • Local/offline compatible</footer>
  </main>

  <script src="src/main.js"></script>
  <script src="includes/script.js"></script>
</body>
</html>
