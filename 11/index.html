<!doctype html>
<html lang="en" manifest="cache.manifest">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PS4 Jailbreak • 9.00 / 11.02</title>
<link rel="stylesheet" href="includes/style.css">
</head>
<body>
  <!-- The reference artwork is the entire visible UI. Functional controls are transparent overlays. -->
  <img class="reference-ui" src="includes/background.png" alt="PS4 Jailbreak">

  <div class="hit-area lapse-area">
    <input type="radio" name="kernel" id="lapse-exploit" value="lapse" checked>
  </div>

  <div class="hit-area netctrl-area">
    <input type="radio" name="kernel" id="netctrl-exploit" value="netctrl">
  </div>

  <label class="hit-area auto-area">
    <span class="sr-only">Auto Jailbreak</span>
    <input id="autoJbInput" type="checkbox" checked>
  </label>

  <button id="jeilbrek" class="hit-area jb-area" type="button" aria-label="Jailbreak"></button>

  <div id="kernel-options" class="sr-only">
    <span id="autoJbLabel">Auto Jailbreak</span>
  </div>

  <pre id="console" class="sr-only">[+] Initializing PS4 9.00 / 11.02 Jailbreak...</pre>
  <div id="UA" class="sr-only"></div>

  <script src="src/main.js"></script>
  <script src="includes/script.js"></script>
</body>
</html>
